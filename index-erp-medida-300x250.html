<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intelisis ERP a tu medida — 300×250</title>
<style>
@font-face{font-family:'Exo 2';font-style:normal;font-weight:800;font-display:swap;src:url('gdn-zips/erp-medida-300x250/exo2-800.woff2') format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#1a1f2e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;font-family:'Exo 2',Arial,sans-serif}
.label{color:#94a3b8;font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-align:center}
/* ── Banner 300×250 ── */
.bc{width:300px;height:250px;position:relative;overflow:hidden;background:#0a1628;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%;z-index:0;pointer-events:none}
.scrim{position:absolute;inset:0;z-index:1;pointer-events:none;animation:scrim 8s infinite linear}
@keyframes scrim{0%,100%{background:rgba(6,14,28,.48)}12%{background:rgba(6,14,28,.42)}22%,88%{background:rgba(4,12,26,.28)}96%{background:rgba(6,14,28,.48)}}
.top{padding:10px 10px 6px;text-align:center;position:absolute;width:100%;height:100%;z-index:2}
.title{font-size:15px;font-weight:800;color:#fff;line-height:1.1;margin-bottom:6px;letter-spacing:-.03em;text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 24px rgba(0,0,0,.35);animation:titleAnim 8s infinite linear}
@keyframes titleAnim{0%,100%{opacity:1;transform:translateY(0)}4%{opacity:.92;transform:translateY(4px)}14%,87.5%,99.99%{opacity:1;transform:translateY(0)}}
.sub{max-width:98%;margin:0 auto;background:rgba(255,255,255,.94);color:#0076c4;font-size:10px;font-weight:800;padding:5px 10px;display:inline-block;border-radius:8px;letter-spacing:.02em;line-height:1.35;border:1px solid rgba(0,156,255,.35);border-left:4px solid #009CFF;box-shadow:0 4px 20px rgba(0,0,0,.2);animation:float 8s infinite cubic-bezier(.45,.05,.55,.95)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.sw{position:absolute;bottom:0;width:100%;height:142px;z-index:5;transform:translateY(100%);animation:slideUp 2.2s cubic-bezier(.25,.8,.25,1) forwards}
@keyframes slideUp{0%{transform:translateY(100%)}8%{transform:translateY(100%)}48%{transform:translateY(-8px)}58%,100%{transform:translateY(0)}}
.bot{position:absolute;top:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding-top:6px;box-sizing:border-box;background:linear-gradient(to top,rgba(4,20,42,.65) 0%,rgba(4,20,42,.30) 50%,rgba(4,20,42,0) 100%)}
.bot .st,.bot .cta,.bot .logo{position:relative;z-index:2}
.st{color:#fff;font-size:11px;font-weight:800;text-align:center;line-height:1.25;margin-bottom:7px;padding:0 8px;text-shadow:0 1px 3px rgba(0,30,60,.35);animation:txtIn 2.2s forwards both}
.lead{display:block;font-weight:800;font-size:15px;letter-spacing:-.02em;margin-bottom:5px;line-height:1.2}
@keyframes txtIn{0%,48%{opacity:0;transform:translateY(12px)}58%,100%{opacity:1;transform:translateY(0)}}
.cta{background:#FF7A00;color:#fff;font-weight:800;font-size:9px;padding:5px 14px 6px;text-transform:uppercase;letter-spacing:.06em;border-radius:8px;border:1px solid #E66E00;box-shadow:0 2px 10px rgba(0,0,0,.28),0 4px 16px rgba(0,0,0,.22);text-shadow:0 1px 1px rgba(0,0,0,.22);cursor:pointer;margin-top:2px;margin-bottom:6px;animation:ctaIn 2.2s forwards both}
@keyframes ctaIn{0%,52%{opacity:0;transform:scale(.82)}62%{opacity:1;transform:scale(1.05)}68%,100%{opacity:1;transform:scale(1)}}
.logo{margin-top:2px;padding-bottom:14px;animation:logoIn 2.2s forwards both}
.logo img{display:block;height:22px;width:auto;max-width:160px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,25,55,.25))}
@keyframes logoIn{0%,62%{opacity:0}72%,100%{opacity:1}}
.click{position:absolute;top:0;left:0;width:100%;height:100%;z-index:9999;cursor:pointer;background:transparent;text-decoration:none;outline:none}
</style>
</head>
<body>
<div class="label">Intelisis ERP a tu medida · 300×250 Medium Rectangle</div>
<div class="bc">
  <img class="bg" src="assets/ceo-frustrated-v1.gif" width="300" height="600" alt="">
  <div class="scrim"></div>
  <div class="top">
    <h1 class="title">Tu operación<br>no es estándar</h1>
    <div class="sub">Tu ERP tampoco debería serlo.</div>
  </div>
  <div class="sw">
    <div class="bot">
      <div class="st"><span class="lead">Intelisis ERP 7000</span></div>
      <div class="cta">Solicita información</div>
      <div class="logo"><img src="assets/logo-intelisis-white-sm.png" width="220" height="48" alt="Intelisis"></div>
    </div>
  </div>
  <a class="click" href="https://www.intelisis.com/intelisis_erp_7000" target="_blank"></a>
</div>
</body>
</html>
