<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=725,height=90">
<meta name="ad.orientation" content="portrait,landscape">
<script>var clickTag="https://www.intelisis.com/intelisis_erp_7000";</script>
<script src="exitapi.js"></script>
<style>
@font-face{font-family:'Exo 2';font-style:normal;font-weight:800;font-display:swap;src:url('exo2-800.woff2') format('woff2')}
@font-face{font-family:'Exo 2';font-style:normal;font-weight:600;font-display:swap;src:url('exo2-600.woff2') format('woff2')}
html,body{margin:0;padding:0;width:725px;height:90px;overflow:hidden}
body{font-family:'Exo 2',Arial,Helvetica,sans-serif;box-sizing:border-box}
.bc{width:725px;height:90px;position:relative;overflow:hidden;background:#0a1628;border:1px solid #ccc;box-sizing:border-box}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%;z-index:0;pointer-events:none}
.bg1{animation:fade1 10s infinite}
.bg2{animation:fade2 10s infinite}
@keyframes fade1{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}
@keyframes fade2{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
.scrim{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to right,rgba(4,12,26,.95) 0%,rgba(4,12,26,.80) 35%,rgba(4,12,26,.20) 65%,rgba(4,12,26,.05) 100%)}
.content{position:absolute;inset:0;z-index:2;display:flex;flex-direction:row;align-items:center;padding:0 24px 0 28px;gap:20px;box-sizing:border-box}
.left{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0;flex:1}
.logo img{display:block;height:20px;width:auto;object-fit:contain;filter:brightness(0) invert(1) drop-shadow(0 1px 3px rgba(0,0,0,.4));margin-bottom:2px}
.title{font-size:18px;font-weight:800;color:#fff;line-height:1.1;letter-spacing:-.03em;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;animation:fadeIn 1s ease forwards}
.sub{font-size:13px;font-weight:600;color:#47b4ff;line-height:1.2;letter-spacing:.01em;white-space:nowrap;animation:fadeIn 1.2s ease forwards}
.ia{color:#009cff}
.cta{background:#FF7A00;color:#fff;font-weight:800;font-size:11px;padding:10px 22px;text-transform:uppercase;letter-spacing:.08em;border-radius:8px;border:1px solid #E66E00;box-shadow:0 2px 10px rgba(0,0,0,.3);white-space:nowrap;flex-shrink:0;animation:fadeIn 1.4s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.click{position:absolute;top:0;left:0;width:100%;height:100%;z-index:9999;cursor:pointer;background:transparent;text-decoration:none;outline:none}
</style>
</head>
<body>
<div class="bc">
  <img class="bg bg1" src="img1.png" width="725" height="90" alt="" loading="eager">
  <img class="bg bg2" src="img2.png" width="725" height="90" alt="" loading="lazy">
  <div class="scrim"></div>
  <div class="content">
    <div class="left">
      <div class="logo"><img src="logo.png" alt="Intelisis" loading="lazy"></div>
      <div class="title">¿Sigues en Excel?</div>
      <div class="sub"><span style="color:#fff">Cámbiate a</span> Intelisis ERP 7000 <span style="color:#fff">y deja de perder dinero.</span></div>
    </div>
    <div class="cta">Solicita información</div>
  </div>
  <a class="click" href="javascript:void(0)" onclick="ExitApi.exit(); window.open(window.clickTag,'_blank');"></a>
</div>
</body>
</html>
