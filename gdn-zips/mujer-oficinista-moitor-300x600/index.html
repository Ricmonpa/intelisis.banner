<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=600">
<meta name="ad.orientation" content="portrait,landscape">
<script>var clickTag="https://www.intelisis.com/intelisis_erp_7000";</script>
<script src="exitapi.js"></script>
<style>
@font-face{font-family:'Exo 2';font-style:normal;font-weight:800;font-display:swap;src:url('exo2-800.woff2') format('woff2')}
@font-face{font-family:'Exo 2';font-style:normal;font-weight:400;font-display:swap;src:url('exo2-400.ttf') format('truetype')}
html,body{margin:0;padding:0;width:300px;height:600px;overflow:hidden}
body{font-family:'Exo 2',Arial,Helvetica,sans-serif;box-sizing:border-box}
.bc{width:300px;height:600px;position:relative;overflow:hidden;background:#0a1628;border:1px solid #ccc;box-sizing:border-box}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:0;pointer-events:none}
.bg1{animation:fade1 10s infinite}
.bg2{animation:fade2 10s infinite}
@keyframes fade1{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}
@keyframes fade2{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
.scrim{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(4,12,26,.18) 0%,rgba(4,12,26,.08) 40%,rgba(4,12,26,.55) 100%)}
.top{padding:30px 15px;text-align:center;position:absolute;width:100%;height:100%;z-index:2;box-sizing:border-box}
.title{font-size:24px;font-weight:800;color:#fff;line-height:1.12;margin-bottom:14px;letter-spacing:-.03em;text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 24px rgba(0,0,0,.35)}
.sub{max-width:94%;margin:0 auto;background:rgba(255,255,255,.94);color:#0076c4;font-size:13px;font-weight:800;padding:10px 16px 10px 14px;display:inline-block;border-radius:8px;letter-spacing:.02em;line-height:1.35;border:1px solid rgba(0,156,255,.35);border-left:4px solid #009CFF;box-shadow:0 4px 20px rgba(0,0,0,.2);animation:float 10s infinite cubic-bezier(.45,.05,.55,.95)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.sw{position:absolute;bottom:0;width:100%;height:248px;z-index:5;transform:translateY(100%);animation:slideUp 2.2s cubic-bezier(.25,.8,.25,1) forwards}
@keyframes slideUp{0%{transform:translateY(100%)}8%{transform:translateY(100%)}48%{transform:translateY(-8px)}58%,100%{transform:translateY(0)}}
.bot{position:absolute;top:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding-top:24px;background:linear-gradient(to top,rgba(4,20,42,.92) 0%,rgba(4,20,42,.55) 50%,rgba(4,20,42,0) 100%)}
.bot .st,.bot .cta,.bot .logo{position:relative;z-index:2}
.st{color:#fff;font-size:16px;font-weight:400;text-align:center;line-height:1.35;margin-bottom:16px;padding:0 16px;text-shadow:0 1px 3px rgba(0,30,60,.35);animation:txtIn 2.2s forwards both}
.lead{display:block;font-weight:800;font-size:20px;letter-spacing:-.02em;margin-bottom:6px;line-height:1.2}
@keyframes txtIn{0%,48%{opacity:0;transform:translateY(12px)}58%,100%{opacity:1;transform:translateY(0)}}
.ia{color:#009cff;font-weight:800;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);color:#009cff;text-shadow:0 0 10px rgba(0,156,255,.35)}50%{transform:scale(1.06);color:#47b4ff;text-shadow:0 0 14px rgba(0,156,255,.55),0 0 28px rgba(0,156,255,.25)}}
.cta{background:#FF7A00;color:#fff;font-weight:800;font-size:12px;padding:11px 22px 12px;text-transform:uppercase;letter-spacing:.08em;border-radius:12px;border:1px solid #E66E00;box-shadow:0 2px 10px rgba(0,0,0,.28),0 4px 16px rgba(0,0,0,.22);text-shadow:0 1px 1px rgba(0,0,0,.22);cursor:pointer;margin-bottom:18px;animation:ctaIn 2.2s forwards both}
@keyframes ctaIn{0%,52%{opacity:0;transform:scale(.82)}62%{opacity:1;transform:scale(1.05)}68%,100%{opacity:1;transform:scale(1)}}
.logo{margin-top:4px;animation:logoIn 2.2s forwards both}
.logo img{display:block;height:38px;width:auto;max-width:232px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,25,55,.25))}
@keyframes logoIn{0%,62%{opacity:0}72%,100%{opacity:1}}
.click{position:absolute;top:0;left:0;width:100%;height:100%;z-index:9999;cursor:pointer;background:transparent;text-decoration:none;outline:none}
</style>
</head>
<body>
<div class="bc">
<img class="bg bg1" src="img1.png" width="300" height="600" alt="" loading="eager">
<img class="bg bg2" src="img2.png" width="300" height="600" alt="" loading="lazy">
<div class="scrim"></div>
<div class="top">
<h1 class="title">¿Tu empresa<br>sigue en Excel?</h1>
<div class="sub">Estás perdiendo control y dinero.</div>
</div>
<div class="sw">
<div class="bot">
<div class="st"><span class="lead">Intelisis ERP 7000:</span>el ERP para la<br>tecnolog<span class="ia">IA</span> de negocio.</div>
<div class="cta">Solicita información</div>
<div class="logo"><img src="logo.png" width="220" height="48" alt="Intelisis" loading="lazy"></div>
</div>
</div>
<a class="click" href="javascript:void(0)" onclick="ExitApi.exit(); window.open(window.clickTag,'_blank');"></a>
</div>
</body>
</html>
