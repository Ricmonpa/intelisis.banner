<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="ad.size" content="width=300,height=250">
<meta name="ad.orientation" content="portrait,landscape">
<script>var clickTag="https://www.intelisis.com/intelisis_erp_7000";</script>
<script src="exitapi.js"></script>
<style>
@font-face{font-family:'Exo 2';font-style:normal;font-weight:800;font-display:swap;src:url('exo2-800.woff2') format('woff2')}
html,body{margin:0;padding:0;width:300px;height:250px;overflow:hidden}
body{font-family:'Exo 2',Arial,Helvetica,sans-serif;box-sizing:border-box}
.bc{width:300px;height:250px;position:relative;overflow:hidden;background:#060c18;border:1px solid #ccc;box-sizing:border-box}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;z-index:0;pointer-events:none}
.bg1{animation:fade1 10s infinite}
.bg2{animation:fade2 10s infinite}
@keyframes fade1{0%,40%{opacity:1}50%,90%{opacity:0}100%{opacity:1}}
@keyframes fade2{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
.scrim{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(to bottom,rgba(4,8,20,.52) 0%,rgba(4,8,20,.05) 30%,rgba(4,8,20,.68) 100%)}
.top{padding:10px 10px 0;text-align:center;position:absolute;width:100%;z-index:2;box-sizing:border-box}
.title{font-size:13px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:6px;letter-spacing:-.02em;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.sub{max-width:98%;margin:0 auto;background:rgba(255,255,255,.93);color:#0076c4;font-size:10px;font-weight:800;padding:5px 10px;display:inline-block;border-radius:8px;letter-spacing:.02em;line-height:1.35;border:1px solid rgba(0,156,255,.35);border-left:4px solid #009CFF;box-shadow:0 4px 16px rgba(0,0,0,.25);animation:float 10s infinite cubic-bezier(.45,.05,.55,.95)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.sw{position:absolute;bottom:0;width:100%;height:108px;z-index:5;transform:translateY(100%);animation:slideUp 2.2s cubic-bezier(.25,.8,.25,1) forwards}
@keyframes slideUp{0%{transform:translateY(100%)}8%{transform:translateY(100%)}48%{transform:translateY(-8px)}58%,100%{transform:translateY(0)}}
.bot{position:absolute;top:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;padding-top:12px;box-sizing:border-box;background:linear-gradient(to top,rgba(4,10,24,.97) 0%,rgba(4,10,24,.65) 55%,rgba(4,10,24,0) 100%)}
.bot .st,.bot .cta,.bot .logo{position:relative;z-index:2}
.st{color:#fff;font-size:10px;font-weight:800;text-align:center;line-height:1.3;margin-bottom:7px;padding:0;width:190px;animation:txtIn 2.2s forwards both}
.lead{display:block;font-size:10px;font-weight:800;color:#fff;letter-spacing:.01em;margin-bottom:3px;line-height:1.2}
.erp{display:block;font-size:14px;font-weight:800;color:#47b4ff;letter-spacing:-.02em;line-height:1.15;text-shadow:0 0 10px rgba(0,156,255,.4)}
.ia{color:#009cff;font-weight:800;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{color:#009cff;text-shadow:0 0 8px rgba(0,156,255,.5)}50%{color:#47b4ff;text-shadow:0 0 12px rgba(0,156,255,.7)}}
@keyframes txtIn{0%,48%{opacity:0;transform:translateY(10px)}58%,100%{opacity:1;transform:translateY(0)}}
.cta{background:#FF7A00;color:#fff;font-weight:800;font-size:9px;padding:6px 0 7px;text-transform:uppercase;letter-spacing:.06em;border-radius:8px;border:1px solid #E66E00;box-shadow:0 2px 10px rgba(255,122,0,.3);text-shadow:0 1px 1px rgba(0,0,0,.22);cursor:pointer;margin-bottom:7px;width:190px;text-align:center;animation:ctaIn 2.2s forwards both}
@keyframes ctaIn{0%,52%{opacity:0;transform:scale(.82)}62%{opacity:1;transform:scale(1.05)}68%,100%{opacity:1;transform:scale(1)}}
.logo{animation:logoIn 2.2s forwards both}
.logo img{display:block;height:20px;width:auto;max-width:140px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
@keyframes logoIn{0%,62%{opacity:0}72%,100%{opacity:1}}
.click{position:absolute;top:0;left:0;width:100%;height:100%;z-index:9999;cursor:pointer;background:transparent;text-decoration:none;outline:none}
</style>
</head>
<body>
<div class="bc">
  <img class="bg bg1" src="img1.png" width="300" height="250" alt="" loading="eager">
  <img class="bg bg2" src="img2.png" width="300" height="250" alt="" loading="lazy">
  <div class="scrim"></div>
  <div class="top">
    <h1 class="title">Decisiones sin datos reales</h1>
    <div class="sub">Estás operando a ciegas.</div>
  </div>
  <div class="sw">
    <div class="bot">
      <div class="st">
        <span class="lead">Crecer con <span class="ia">IA</span> empieza con</span>
        <span class="erp">Intelisis ERP 7000</span>
      </div>
      <div class="cta">Solicita Información</div>
      <div class="logo"><img src="logo.png" width="140" height="30" alt="Intelisis" loading="lazy"></div>
    </div>
  </div>
  <a class="click" href="javascript:void(0)" onclick="ExitApi.exit(); window.open(window.clickTag,'_blank');"></a>
</div>
</body>
</html>
