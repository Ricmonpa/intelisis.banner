<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            var p = new URLSearchParams(location.search);
            if (p.get('embed') === '1') {
                document.documentElement.classList.add('embed-demo', 'embed-size-728x90');
            }
        })();
    </script>
    <title>Banner Intelisis V2 — Vídeo (728×90)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="brand-assets.css">
    <link rel="stylesheet" href="banner-video.css">
    <link rel="stylesheet" href="banner-video-sizes.css">
    <style>
        :root {
            /* Línea editorial Intelisis (MATERIALES / ebooks feb 2026 / Potencial 2026) */
            --intelisis-blue: #009CFF;
            --intelisis-blue-deep: #0076c4;
            --intelisis-blue-wave: #47b4ff;
            --intelisis-orange-cta: #f39200;
            --intelisis-orange-cta-border: #e08600;
            --intelisis-orange-bright: #ffaa00;
            --intelisis-ink: #1a1f2e;
            /* Superficie gris editorial (materiales tipo ebook / Potencial) */
            --intelisis-surface: #e6e8ef;
        }

        /* Sincronizado con la ola (8s): gris/sage → blanco mientras domina Intelisis */
        @keyframes demoBackdrop {
            0%, 100% { background-color: #f0f0f0; }
            28% { background-color: #f0f0f0; }
            40% { background-color: #ffffff; }
            88% { background-color: #ffffff; }
            96% { background-color: #f0f0f0; }
        }

        @keyframes bannerStageBg {
            0%, 100% { background-color: #e6e8ef; }
            28% { background-color: #e6e8ef; }
            40% { background-color: #ffffff; }
            88% { background-color: #ffffff; }
            96% { background-color: #e6e8ef; }
        }

        body {
            font-family: 'Exo 2', system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            background-color: #f0f0f0;
            animation: demoBackdrop 8s infinite linear;
        }

        html.embed-demo {
            margin: 0;
            height: 600px;
            overflow: hidden;
            background: #161616;
        }

        html.embed-demo body {
            animation: none;
            background: #161616 !important;
            min-height: 600px;
            height: 600px;
            width: 300px;
            margin: 0;
            padding: 0;
            gap: 0;
            overflow: hidden;
            box-sizing: border-box;
        }

        html.embed-demo .demo-chrome {
            display: none !important;
        }

        .banner-container {
            width: 300px;
            height: 600px;
            background-color: var(--intelisis-surface);
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 20, 50, 0.12);
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E");
            animation: bannerStageBg 8s infinite linear;
        }

        .top-section {
            padding: 30px 15px;
            text-align: center;
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .title-main {
            position: relative;
            z-index: 4;
            font-size: 24px;
            font-weight: 800;
            color: var(--intelisis-ink);
            line-height: 1.12;
            margin-bottom: 14px;
            letter-spacing: -0.03em;
            text-shadow: none;
            animation: titleRevealElegant 8s infinite linear;
        }

        /* Alerta sin rojo: línea editorial (azul marca + superficie clara) */
        .subtitle-box {
            position: relative;
            z-index: 4;
            max-width: 94%;
            margin-left: auto;
            margin-right: auto;
            background: rgba(255, 255, 255, 0.92);
            color: var(--intelisis-blue-deep);
            font-size: 13px;
            font-weight: 600;
            padding: 10px 16px 10px 14px;
            display: inline-block;
            transform: none;
            border-radius: 8px;
            letter-spacing: 0.02em;
            line-height: 1.35;
            border: 1px solid rgba(0, 156, 255, 0.35);
            border-left: 4px solid var(--intelisis-blue);
            box-shadow: 0 4px 18px rgba(0, 80, 140, 0.1);
            animation: float 8s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        .solution-wrapper {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 400px;
            z-index: 5;
            transform: translateY(450px);
        }

        .wave-container {
            position: absolute;
            top: -60px;
            width: 100%;
            height: 100px;
        }

        .wave-layer-1 {
            position: absolute;
            bottom: 0;
            width: 150%;
            height: 80px;
            background-color: var(--intelisis-blue-wave);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            left: -20%;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.2);
            transform: rotate(-3deg);
        }

        .wave-layer-2 {
            position: absolute;
            bottom: -20px;
            width: 160%;
            height: 100px;
            background-color: var(--intelisis-blue);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            left: -30%;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.25);
            transform: rotate(2deg);
        }

        .bottom-section {
            position: absolute;
            top: 40px;
            width: 100%;
            height: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 48px;
            background-color: var(--intelisis-blue);
            background-image:
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n2'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n2)' opacity='0.04'/%3E%3C/svg%3E"),
                linear-gradient(180deg, var(--intelisis-blue-deep) 0%, var(--intelisis-blue) 42%, var(--intelisis-blue) 100%);
        }

        .bottom-section .solution-text,
        .bottom-section .cta-button,
        .bottom-section .logo-container {
            position: relative;
            z-index: 2;
        }

        .solution-text {
            color: #fff;
            font-size: 17px;
            font-weight: 500;
            text-align: center;
            line-height: 1.35;
            margin-bottom: 18px;
            padding: 0 16px;
            text-shadow: 0 1px 3px rgba(0, 30, 60, 0.35);
        }

        .solution-text .solution-lead {
            display: block;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .highlight-ia {
            background-color: var(--intelisis-orange-cta);
            color: #fff;
            padding: 2px 7px;
            border-radius: 4px;
            display: inline-block;
            font-weight: 800;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transform: rotate(1deg);
        }

        .cta-button {
            background-color: var(--intelisis-orange-cta);
            color: #fff;
            font-weight: 800;
            font-size: 13px;
            padding: 12px 22px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
            cursor: pointer;
            border: 2px solid var(--intelisis-orange-cta-border);
            margin-bottom: 22px;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0 12px;
            max-width: 100%;
        }

        .intelisis-logo-img {
            display: block;
            height: 38px;
            width: auto;
            max-width: min(232px, 100%);
            object-fit: contain;
            object-position: center;
            filter: drop-shadow(0 2px 6px rgba(0, 25, 55, 0.25));
        }

        /* --- Controles (fuera del banner) --- */
        .demo-controls {
            font-family: 'Exo 2', system-ui, sans-serif;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        .demo-controls button {
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #d0d5dd;
            background: #f8fafc;
            cursor: pointer;
            color: #1e293b;
        }

        .demo-controls button:hover {
            background: #e2e8f0;
        }

        .demo-controls button.is-active {
            background: var(--intelisis-blue);
            color: #fff;
            border-color: var(--intelisis-blue-deep);
        }

        .demo-controls .label {
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            margin-right: 4px;
        }

        /* --- KEYFRAMES: bucle 8s, 0% === 100% --- */
        @keyframes float {
            0%, 100% { transform: translateY(0); animation-timing-function: cubic-bezier(0.45, 0.05, 0.55, 0.95); }
            50% { transform: translateY(-4px); animation-timing-function: cubic-bezier(0.45, 0.05, 0.55, 0.95); }
        }

        @keyframes titleRevealElegant {
            0%, 100% {
                opacity: 1;
                transform: translateY(0);
                animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            }
            4% {
                opacity: 0.92;
                transform: translateY(4px);
                animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
            }
            14% {
                opacity: 1;
                transform: translateY(0);
                animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
            }
            87.5%, 99.99% {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
</head>
<body>

    <div class="banner-728-scale-wrap">
    <div class="banner-container banner-container--video banner--728x90" id="intelisis-banner">
        <img class="banner-video-bg" src="assets/728x90-oficinista-frustrada.webp" width="728" height="90" alt="" role="presentation" decoding="async" fetchpriority="high">
        <div class="banner-video-scrim" aria-hidden="true"></div>
        <div class="top-section">
            <h1 class="title-main">¿Tu empresa<br>sigue en Excel?</h1>
            <div class="subtitle-box">
                Estás perdiendo control y dinero.
            </div>
        </div>

        <div class="solution-wrapper">
            <div class="wave-container">
                <div class="wave-layer-1"></div>
                <div class="wave-layer-2"></div>
            </div>

            <div class="bottom-section">
                <div class="solution-text">
                    <span class="solution-lead">Intelisis ERP 7000:</span>
                    el ERP para la tecnolog<span class="highlight-ia">IA</span> de negocio.
                </div>

                <div class="cta-button">
                    Solicita información
                </div>

                <div class="logo-container">
                    <img class="intelisis-logo-img" src="assets/Aplicativos_Logotipo/Aplicativos_Logotipo/Logotipo_Intelisis_blanco.png" width="220" height="48" alt="Intelisis" decoding="async" />
                </div>
            </div>
        </div>
    </div>
    </div>

    <div class="demo-chrome">
    <p style="margin:0 0 8px;font-family:'Exo 2',system-ui,sans-serif;font-size:12px;color:#64748b;max-width:728px;text-align:center;">
        <strong>728×90</strong> ·
        <a href="index-video.html" style="color:#009CFF;font-weight:600;">V2 300×600</a> ·
        <a href="index-video-300x250.html" style="color:#009CFF;font-weight:600;">V2 300×250</a> ·
        <a href="index.html" style="color:#009CFF;font-weight:600;">V1</a>
        <br><span style="font-size:11px;">Fondo <strong>WebP</strong> nativo 728×90 · <a href="ads-300x600.html" style="color:#009CFF;font-weight:600;">Ads 300×600</a> · Embed: <code>?embed=1</code></span>
    </p>
    <div class="demo-controls" aria-label="Controles de demo del banner">
        <button type="button" id="btn-toggle" title="Pausar o reanudar">Pausa</button>
        <button type="button" id="btn-restart" title="Reiniciar desde el inicio">Reiniciar</button>
        <span class="label">Velocidad</span>
        <button type="button" class="speed-btn" data-rate="0.5">0.5×</button>
        <button type="button" class="speed-btn is-active" data-rate="1">1×</button>
        <button type="button" class="speed-btn" data-rate="2">2×</button>
    </div>
    </div>

    <script>
        (function () {
            const banner = document.getElementById('intelisis-banner');
            const btnToggle = document.getElementById('btn-toggle');
            const btnRestart = document.getElementById('btn-restart');
            const speedBtns = document.querySelectorAll('.speed-btn');
            const isEmbed = document.documentElement.classList.contains('embed-demo');

            function getAnimations() {
                const out = [];
                if (banner && banner.getAnimations) {
                    out.push.apply(out, banner.getAnimations({ subtree: true }));
                }
                if (!isEmbed && document.body.getAnimations) {
                    out.push.apply(out, document.body.getAnimations());
                }
                return out;
            }

            let currentRate = 1;

            function applyPlaybackRate(rate) {
                currentRate = rate;
                getAnimations().forEach(function (a) {
                    a.playbackRate = rate;
                });
            }

            function syncToggleLabel() {
                const anims = getAnimations();
                const running = anims.some(function (a) { return a.playState === 'running'; });
                btnToggle.textContent = running ? 'Pausa' : 'Reproducir';
            }

            btnToggle.addEventListener('click', function () {
                const anims = getAnimations();
                if (!anims.length) return;
                const anyRunning = anims.some(function (a) { return a.playState === 'running'; });
                anims.forEach(function (a) {
                    if (anyRunning) a.pause();
                    else {
                        a.playbackRate = currentRate;
                        a.play();
                    }
                });
                syncToggleLabel();
            });

            btnRestart.addEventListener('click', function () {
                const anims = getAnimations();
                const wasPaused = anims.some(function (a) { return a.playState === 'paused'; });
                anims.forEach(function (a) {
                    a.currentTime = 0;
                    a.playbackRate = currentRate;
                    a.play();
                    if (wasPaused) a.pause();
                });
                syncToggleLabel();
            });

            speedBtns.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    const rate = Number(btn.getAttribute('data-rate')) || 1;
                    speedBtns.forEach(function (b) { b.classList.remove('is-active'); });
                    btn.classList.add('is-active');
                    applyPlaybackRate(rate);
                    getAnimations().forEach(function (a) {
                        if (a.playState === 'paused') a.pause();
                    });
                });
            });

            requestAnimationFrame(function () {
                applyPlaybackRate(1);
                syncToggleLabel();
            });
        })();
    </script>
</body>
</html>
