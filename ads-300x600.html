<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="ad.size" content="width=300,height=600">
    <script type="text/javascript">var clickTag = "https://www.intelisis.com";</script>
    <title>Intelisis ERP 7000 — 300×600 (Google Ads)</title>
    <link rel="stylesheet" href="brand-assets.css">
    <link rel="stylesheet" href="banner-video.css">
    <style>
        :root {
            --intelisis-blue: #009CFF;
            --intelisis-blue-deep: #0076c4;
            --intelisis-blue-wave: #47b4ff;
            --intelisis-orange-cta: #FF7A00;
            --intelisis-orange-cta-border: #e08600;
            --intelisis-orange-bright: #ffaa00;
            --intelisis-ink: #1a1f2e;
            --intelisis-surface: #e6e8ef;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 300px;
            height: 600px;
            overflow: hidden;
        }

        body {
            font-family: 'Exo 2', system-ui, sans-serif;
            box-sizing: border-box;
        }

        .banner-container {
            width: 300px;
            height: 600px;
            background-color: var(--intelisis-surface);
            position: relative;
            overflow: hidden;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E");
            animation: bannerStageBg 8s infinite linear;
        }

        .top-section {
            padding: 30px 15px;
            text-align: center;
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .title-main {
            position: relative;
            z-index: 4;
            font-size: 24px;
            font-weight: 800;
            color: var(--intelisis-ink);
            line-height: 1.12;
            margin-bottom: 14px;
            letter-spacing: -0.03em;
            text-shadow: none;
            animation: titleRevealElegant 8s infinite linear;
        }

        .subtitle-box {
            position: relative;
            z-index: 4;
            max-width: 94%;
            margin-left: auto;
            margin-right: auto;
            background: rgba(255, 255, 255, 0.92);
            color: var(--intelisis-blue-deep);
            font-size: 13px;
            font-weight: 600;
            padding: 10px 16px 10px 14px;
            display: inline-block;
            transform: none;
            border-radius: 8px;
            letter-spacing: 0.02em;
            line-height: 1.35;
            border: 1px solid rgba(0, 156, 255, 0.35);
            border-left: 4px solid var(--intelisis-blue);
            box-shadow: 0 4px 18px rgba(0, 80, 140, 0.1);
            animation: float 8s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        .solution-wrapper {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 400px;
            z-index: 5;
            transform: translateY(450px);
        }

        .wave-container {
            position: absolute;
            top: -60px;
            width: 100%;
            height: 100px;
        }

        .wave-layer-1 {
            position: absolute;
            bottom: 0;
            width: 150%;
            height: 80px;
            background-color: var(--intelisis-blue-wave);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            left: -20%;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.2);
            transform: rotate(-3deg);
        }

        .wave-layer-2 {
            position: absolute;
            bottom: -20px;
            width: 160%;
            height: 100px;
            background-color: var(--intelisis-blue);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            left: -30%;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.25);
            transform: rotate(2deg);
        }

        .bottom-section {
            position: absolute;
            top: 40px;
            width: 100%;
            height: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 48px;
            background-color: var(--intelisis-blue);
            background-image:
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n2'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n2)' opacity='0.04'/%3E%3C/svg%3E"),
                linear-gradient(180deg, var(--intelisis-blue-deep) 0%, var(--intelisis-blue) 42%, var(--intelisis-blue) 100%);
        }

        .bottom-section .solution-text,
        .bottom-section .cta-button,
        .bottom-section .logo-container {
            position: relative;
            z-index: 2;
        }

        .solution-text {
            color: #fff;
            font-size: 17px;
            font-weight: 500;
            text-align: center;
            line-height: 1.35;
            margin-bottom: 18px;
            padding: 0 16px;
            text-shadow: 0 1px 3px rgba(0, 30, 60, 0.35);
        }

        .solution-text .solution-lead {
            display: block;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .highlight-ia {
            background-color: var(--intelisis-orange-cta);
            color: #fff;
            padding: 2px 7px;
            border-radius: 4px;
            display: inline-block;
            font-weight: 800;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transform: rotate(1deg);
        }

        .cta-button {
            background-color: var(--intelisis-orange-cta);
            color: #fff;
            font-weight: 800;
            font-size: 13px;
            padding: 12px 22px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
            cursor: pointer;
            border: 2px solid var(--intelisis-orange-cta-border);
            margin-bottom: 22px;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0 12px;
            max-width: 100%;
        }

        .intelisis-logo-img {
            display: block;
            height: 38px;
            width: auto;
            max-width: min(232px, 100%);
            object-fit: contain;
            object-position: center;
            filter: drop-shadow(0 2px 6px rgba(0, 25, 55, 0.25));
        }

        @keyframes bannerStageBg {
            0%, 100% { background-color: #e6e8ef; }
            28% { background-color: #e6e8ef; }
            40% { background-color: #ffffff; }
            88% { background-color: #ffffff; }
            96% { background-color: #e6e8ef; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); animation-timing-function: cubic-bezier(0.45, 0.05, 0.55, 0.95); }
            50% { transform: translateY(-4px); animation-timing-function: cubic-bezier(0.45, 0.05, 0.55, 0.95); }
        }

        @keyframes titleRevealElegant {
            0%, 100% {
                opacity: 1;
                transform: translateY(0);
                animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            }
            4% {
                opacity: 0.92;
                transform: translateY(4px);
                animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
            }
            14% {
                opacity: 1;
                transform: translateY(0);
                animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
            }
            87.5%, 99.99% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Capa de clic Google Ads (por encima del contenido visual) */
        .banner-click-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            cursor: pointer;
            background: transparent;
            text-decoration: none;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="banner-container banner-container--video" id="intelisis-banner">
        <img class="banner-video-bg" src="assets/300x600.webp" width="300" height="600" alt="" role="presentation" decoding="async" fetchpriority="high">

        <div class="banner-video-scrim" aria-hidden="true"></div>

        <div class="top-section">
            <h1 class="title-main">¿Tu empresa<br>sigue en Excel?</h1>
            <div class="subtitle-box">
                Estás perdiendo control y dinero.
            </div>
        </div>

        <div class="solution-wrapper">
            <div class="wave-container">
                <div class="wave-layer-1"></div>
                <div class="wave-layer-2"></div>
            </div>

            <div class="bottom-section">
                <div class="solution-text">
                    <span class="solution-lead">Intelisis ERP 7000:</span>
                    el ERP para la<br>tecnolog<span class="highlight-ia">IA</span> de negocio.
                </div>

                <div class="cta-button">
                    Solicita información
                </div>

                <div class="logo-container">
                    <img class="intelisis-logo-img" src="assets/Aplicativos_Logotipo/Aplicativos_Logotipo/Logotipo_Intelisis_blanco.png" width="220" height="48" alt="" decoding="async">
                </div>
            </div>
        </div>

        <a class="banner-click-layer" href="javascript:window.open(window.clickTag, '_blank');" aria-label="Abrir sitio Intelisis" title="Intelisis"></a>
    </div>

</body>
</html>
