<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=300,initial-scale=1">
  <meta name="ad.size" content="width=300,height=600">
  <script>var clickTag = "https://www.intelisis.com";</script>
  <title>Intelisis 300×600</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:0;width:300px;height:600px;overflow:hidden}
    body{font:12px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0a1628;color:#fff}
    .ad{position:relative;width:300px;height:600px;overflow:hidden;cursor:pointer}
    .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none;z-index:0}
    .vignette{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(10,22,40,.72) 0%,transparent 26%,transparent 52%,rgba(10,22,40,.9) 100%)}
    .copy{position:absolute;inset:0;z-index:2;padding:14px 12px 0;pointer-events:none;text-align:center}
    h1{margin:0;font-size:22px;font-weight:800;line-height:1.08;text-shadow:0 2px 12px rgba(0,0,0,.45)}
    .mini{margin:10px auto 0;max-width:260px;padding:6px 8px;background:rgba(255,255,255,.14);border-radius:4px;font-size:11px;font-weight:600}
    .bar{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:10px 10px 12px;pointer-events:none;background:linear-gradient(0deg,rgba(0,48,87,.96),rgba(0,48,87,.5));text-align:center}
    .bar p{margin:0 0 6px;font-size:11px;line-height:1.25}
    .hl{color:#ff6b1a;font-weight:800}
    .cta{display:inline-block;margin:4px 0 8px;padding:6px 14px;background:#ff6b1a;color:#fff;font-size:11px;font-weight:800;border-radius:4px}
    .logo{margin:0 auto;display:block;max-width:160px;width:100%;height:auto}
  </style>
</head>
<body>
  <div class="ad" role="link" tabindex="0" aria-label="Intelisis — abrir sitio" onclick="window.open(window.clickTag,'_blank')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.open(window.clickTag,'_blank');}">
    <img class="bg" src="assets/300x600-oficinista-2.gif" alt="" width="300" height="600" decoding="async">
    <div class="vignette" aria-hidden="true"></div>
    <div class="copy">
      <h1>¿Tu empresa<br>sigue en Excel?</h1>
      <div class="mini">Estás perdiendo control y dinero.</div>
    </div>
    <div class="bar">
      <p><strong>Intelisis ERP 7000:</strong> el ERP para la tecnolog<span class="hl">IA</span> de negocio.</p>
      <span class="cta">Solicita información</span>
      <img class="logo" src="assets/Aplicativos_Logotipo/Aplicativos_Logotipo/Logotipo_Intelisis_blanco.png" alt="" width="220" height="48" decoding="async">
    </div>
  </div>
</body>
</html>
