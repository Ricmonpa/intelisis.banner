<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            if (new URLSearchParams(location.search).get('embed') === '1') {
                document.documentElement.classList.add('embed-demo');
            }
        })();
    </script>
    <title>Banner Intelisis - 300x600 Animado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="brand-assets.css">
    <style>
        :root {
            /* LÃ­nea editorial Intelisis (MATERIALES / ebooks feb 2026 / Potencial 2026) */
            --intelisis-blue: #009CFF;
            --intelisis-blue-deep: #0076c4;
            --intelisis-blue-wave: #47b4ff;
            --intelisis-orange-cta: #FF7A00;
            --intelisis-orange-cta-border: #e08600;
            --intelisis-orange-bright: #ffaa00;
            --intelisis-ink: #1a1f2e;
            /* Superficie gris editorial (materiales tipo ebook / Potencial) */
            --intelisis-surface: #e6e8ef;
        }

        /* Sincronizado con la ola (8s): gris/sage â†’ blanco mientras domina Intelisis */
        @keyframes demoBackdrop {
            0%, 100% { background-color: #f0f0f0; }
            28% { background-color: #f0f0f0; }
            40% { background-color: #ffffff; }
            88% { background-color: #ffffff; }
            96% { background-color: #f0f0f0; }
        }

        @keyframes bannerStageBg {
            0%, 100% { background-color: #e6e8ef; }
            28% { background-color: #e6e8ef; }
            40% { background-color: #ffffff; }
            88% { background-color: #ffffff; }
            96% { background-color: #e6e8ef; }
        }

        body {
            font-family: 'Exo 2', system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            background-color: #f0f0f0;
            animation: demoBackdrop 8s infinite linear;
        }

        html.embed-demo {
            margin: 0;
            height: 600px;
            overflow: hidden;
            background: #161616;
        }

        html.embed-demo body {
            animation: none;
            background: #161616 !important;
            min-height: 600px;
            height: 600px;
            width: 300px;
            margin: 0;
            padding: 0;
            gap: 0;
            overflow: hidden;
            box-sizing: border-box;
        }

        html.embed-demo .demo-chrome {
            display: none !important;
        }

        .banner-container {
            width: 300px;
            height: 600px;
            background-color: var(--intelisis-surface);
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 20, 50, 0.12);
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E");
            animation: bannerStageBg 8s infinite linear;
        }

        .top-section {
            padding: 30px 15px;
            text-align: center;
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .title-main {
            position: relative;
            z-index: 4;
            font-size: 24px;
            font-weight: 800;
            color: var(--intelisis-ink);
            line-height: 1.12;
            margin-bottom: 14px;
            letter-spacing: -0.03em;
            text-shadow: none;
            animation: shake 8s infinite linear;
        }

        /* Alerta sin rojo: lÃ­nea editorial (azul marca + superficie clara) */
        .subtitle-box {
            position: relative;
            z-index: 4;
            max-width: 94%;
            margin-left: auto;
            margin-right: auto;
            background: rgba(255, 255, 255, 0.92);
            color: var(--intelisis-blue-deep);
            font-size: 13px;
            font-weight: 600;
            padding: 10px 16px 10px 14px;
            display: inline-block;
            transform: rotate(-1deg);
            border-radius: 8px;
            letter-spacing: 0.02em;
            line-height: 1.35;
            border: 1px solid rgba(0, 156, 255, 0.35);
            border-left: 4px solid var(--intelisis-blue);
            box-shadow: 0 4px 18px rgba(0, 80, 140, 0.1);
            animation: float 8s infinite cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        .excel-icon {
            width: 90px;
            height: 110px;
            background-color: #1d6f42;
            position: absolute;
            top: 200px;
            left: 30px;
            z-index: 2;
            transform: rotate(-10deg);
            box-shadow: 3px 3px 8px rgba(0,0,0,0.3);
            clip-path: polygon(0% 0%, 100% 0%, 100% 70%, 80% 80%, 90% 100%, 50% 90%, 20% 100%, 30% 75%, 0% 100%);
            animation: fallBreak 8s infinite both;
            pointer-events: none;
        }

        .excel-icon::after {
            content: "X";
            color: white;
            font-size: 55px;
            font-weight: 800;
            position: absolute;
            top: 15px;
            left: 20px;
        }

        .falling-cells {
            position: absolute;
            top: 250px;
            right: 20px;
            z-index: 2;
            width: 100px;
            height: 80px;
            background-color: white;
            border: 2px solid #ccc;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            background-image: linear-gradient(0deg, transparent 24%, #eee 25%, #eee 26%, transparent 27%, transparent 74%, #eee 75%, #eee 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, #eee 25%, #eee 26%, transparent 27%, transparent 74%, #eee 75%, #eee 76%, transparent 77%, transparent);
            background-size: 20px 20px;
            clip-path: polygon(10% 0, 100% 0, 100% 80%, 80% 100%, 0 100%, 0 20%);
            animation: cellDrop 8s infinite both;
            pointer-events: none;
        }

        .panicked-worker-container {
            position: absolute;
            top: 218px;
            left: 48px;
            width: 210px;
            height: 160px;
            z-index: 2;
            animation: fallBreakWorker 8s infinite both;
            pointer-events: none;
        }

        .panicked-worker-svg {
            width: 100%;
            height: 100%;
            animation: panicTremble 0.14s infinite alternate ease-in-out;
            transform-origin: bottom center;
        }

        .solution-wrapper {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 400px;
            z-index: 5;
            transform: translateY(450px);
            animation: slideUp 8s infinite both;
        }

        .wave-container {
            position: absolute;
            top: -60px;
            width: 100%;
            height: 100px;
        }

        .wave-layer-1 {
            position: absolute;
            bottom: 0;
            width: 150%;
            height: 80px;
            background-color: var(--intelisis-blue-wave);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            left: -20%;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.2);
            transform: rotate(-3deg);
        }

        .wave-layer-2 {
            position: absolute;
            bottom: -20px;
            width: 160%;
            height: 100px;
            background-color: var(--intelisis-blue);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            left: -30%;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.25);
            transform: rotate(2deg);
        }

        /* Ciudad solo sobre el panel azul (no invade titular / subtÃ­tulo) */
        .paper-city {
            position: absolute;
            top: -38px;
            right: 4px;
            width: 82px;
            height: 82px;
            z-index: 1;
            opacity: 0;
            animation: popIn 8s infinite both;
            pointer-events: none;
        }

        .bottom-section {
            position: absolute;
            top: 40px;
            width: 100%;
            height: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 48px;
            background-color: var(--intelisis-blue);
            background-image:
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n2'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n2)' opacity='0.04'/%3E%3C/svg%3E"),
                linear-gradient(180deg, var(--intelisis-blue-deep) 0%, var(--intelisis-blue) 42%, var(--intelisis-blue) 100%);
        }

        .bottom-section .solution-text,
        .bottom-section .cta-button,
        .bottom-section .logo-container {
            position: relative;
            z-index: 2;
        }

        .solution-text {
            color: #fff;
            font-size: 17px;
            font-weight: 500;
            text-align: center;
            line-height: 1.35;
            margin-bottom: 22px;
            padding: 0 16px;
            text-shadow: 0 1px 3px rgba(0, 30, 60, 0.35);
            opacity: 0;
            animation: fadeInText 8s infinite both;
        }

        .solution-text .solution-lead {
            display: block;
            font-weight: 800;
            font-size: 19px;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .highlight-ia {
            background-color: var(--intelisis-orange-cta);
            color: #fff;
            padding: 2px 7px;
            border-radius: 4px;
            display: inline-block;
            font-weight: 800;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
            transform: rotate(1deg);
            animation: pulseIA 8s infinite both;
        }

        .cta-button {
            background-color: var(--intelisis-orange-cta);
            color: #FFFFFF;
            font-weight: 800;
            font-size: 13px;
            padding: 12px 22px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
            cursor: pointer;
            border: 2px solid var(--intelisis-orange-cta-border);
            margin-bottom: 26px;
            margin-top: 2px;
            opacity: 0;
            animation: popInCTA 8s infinite both;
        }

        .cta-button:hover {
            background-color: #E66E00;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 4px;
            opacity: 0;
            animation: fadeInLogo 8s infinite both;
            padding: 0 12px;
            max-width: 100%;
        }

        .intelisis-logo-img {
            display: block;
            height: 38px;
            width: auto;
            max-width: min(232px, 100%);
            object-fit: contain;
            object-position: center;
            filter: drop-shadow(0 2px 6px rgba(0, 25, 55, 0.25));
        }

        /* --- Controles (fuera del banner) --- */
        .demo-controls {
            font-family: 'Exo 2', system-ui, sans-serif;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 14px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        .demo-controls button {
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #d0d5dd;
            background: #f8fafc;
            cursor: pointer;
            color: #1e293b;
        }

        .demo-controls button:hover {
            background: #e2e8f0;
        }

        .demo-controls button.is-active {
            background: var(--intelisis-blue);
            color: #fff;
            border-color: var(--intelisis-blue-deep);
        }

        .demo-controls .label {
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            margin-right: 4px;
        }

        /* --- KEYFRAMES: bucle 8s, 0% === 100% --- */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-2deg); animation-timing-function: cubic-bezier(0.45, 0.05, 0.55, 0.95); }
            50% { transform: translateY(-6px) rotate(0deg); animation-timing-function: cubic-bezier(0.45, 0.05, 0.55, 0.95); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); animation-timing-function: cubic-bezier(0.36, 0, 0.66, -0.56); }
            2.5% { transform: translateX(-3px); animation-timing-function: cubic-bezier(0.34, 1.2, 0.64, 1); }
            5% { transform: translateX(3px); animation-timing-function: cubic-bezier(0.34, 1.2, 0.64, 1); }
            7.5% { transform: translateX(-2px); animation-timing-function: cubic-bezier(0.34, 1.2, 0.64, 1); }
            10% { transform: translateX(2px); animation-timing-function: cubic-bezier(0.34, 1.2, 0.64, 1); }
            12.5%, 87.5% { transform: translateX(0); animation-timing-function: steps(1); }
            90% { transform: translateX(-2px); animation-timing-function: cubic-bezier(0.34, 1.2, 0.64, 1); }
            92.5% { transform: translateX(2px); animation-timing-function: cubic-bezier(0.34, 1.2, 0.64, 1); }
            95% { transform: translateX(-1px); animation-timing-function: cubic-bezier(0.34, 1.2, 0.64, 1); }
            97.5% { transform: translateX(1px); }
        }

        @keyframes fallBreak {
            0%, 100% {
                transform: translateY(-48px) rotate(-10deg);
                opacity: 0;
                animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            }
            6% {
                transform: translateY(0) rotate(-10deg);
                opacity: 1;
                animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
            }
            14% {
                transform: translateY(10px) rotate(-12deg);
                opacity: 1;
                animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
            }
            22% {
                transform: translateY(14px) rotate(-13deg);
                opacity: 1;
                animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53);
            }
            34% {
                transform: translateY(210px) rotate(-26deg);
                opacity: 0;
                animation-timing-function: steps(1);
            }
            34.01%, 99.99% {
                transform: translateY(210px) rotate(-26deg);
                opacity: 0;
                animation-timing-function: steps(1);
            }
        }

        @keyframes fallBreakWorker {
            0%, 100% {
                transform: translateY(-48px) rotate(-10deg);
                opacity: 0;
                animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            }
            7.5% {
                transform: translateY(0) rotate(-10deg);
                opacity: 1;
                animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
            }
            15.5% {
                transform: translateY(10px) rotate(-12deg);
                opacity: 1;
                animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
            }
            23.5% {
                transform: translateY(14px) rotate(-13deg);
                opacity: 1;
                animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53);
            }
            35.5% {
                transform: translateY(210px) rotate(-26deg);
                opacity: 0;
                animation-timing-function: steps(1);
            }
            35.51%, 99.99% {
                transform: translateY(210px) rotate(-26deg);
                opacity: 0;
                animation-timing-function: steps(1);
            }
        }

        @keyframes cellDrop {
            0%, 100% {
                transform: translateY(-36px) rotate(14deg);
                opacity: 0;
                animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            }
            8% {
                transform: translateY(0) rotate(15deg);
                opacity: 1;
                animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
            }
            18% {
                transform: translateY(12px) rotate(18deg);
                opacity: 1;
                animation-timing-function: cubic-bezier(0.55, 0.085, 0.68, 0.53);
            }
            36% {
                transform: translateY(260px) rotate(48deg);
                opacity: 0;
                animation-timing-function: steps(1);
            }
            36.01%, 99.99% {
                transform: translateY(260px) rotate(48deg);
                opacity: 0;
                animation-timing-function: steps(1);
            }
        }

        @keyframes panicTremble {
            0% { transform: rotate(-2.5deg) scale(0.98); }
            100% { transform: rotate(2.5deg) scale(1.02); }
        }

        @keyframes slideUp {
            0%, 100% {
                transform: translateY(450px);
                animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1);
            }
            28% {
                transform: translateY(450px);
                animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
            }
            40% {
                transform: translateY(-14px);
                animation-timing-function: cubic-bezier(0.34, 1.25, 0.64, 1);
            }
            48% {
                transform: translateY(0);
                animation-timing-function: cubic-bezier(0.25, 0.8, 0.25, 1);
            }
            88% {
                transform: translateY(0);
                animation-timing-function: cubic-bezier(0.7, 0, 0.84, 0);
            }
            99.5% {
                transform: translateY(450px);
                animation-timing-function: cubic-bezier(0.7, 0, 0.84, 0);
            }
        }

        @keyframes fadeInText {
            0%, 100% {
                opacity: 0;
                transform: translateY(12px);
                animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            }
            46% {
                opacity: 0;
                transform: translateY(12px);
                animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            }
            52% {
                opacity: 1;
                transform: translateY(0);
                animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            }
            88% {
                opacity: 1;
                transform: translateY(0);
                animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            }
            99% {
                opacity: 0;
                transform: translateY(8px);
            }
        }

        @keyframes popInCTA {
            0%, 100% {
                opacity: 0;
                transform: scale(0.82);
                animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            54% {
                opacity: 0;
                transform: scale(0.82);
                animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            60% {
                opacity: 1;
                transform: scale(1.04);
                animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            64% {
                opacity: 1;
                transform: scale(1);
                animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            }
            88% {
                opacity: 1;
                transform: scale(1);
                animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            }
            99% {
                opacity: 0;
                transform: scale(0.92);
            }
        }

        @keyframes fadeInLogo {
            0%, 100% { opacity: 0; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            64% { opacity: 0; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            72% { opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            88% { opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            99% { opacity: 0; }
        }

        @keyframes popIn {
            0%, 100% {
                opacity: 0;
                transform: translateY(22px) scale(0.96);
                animation-timing-function: cubic-bezier(0.34, 1.4, 0.64, 1);
            }
            44% {
                opacity: 0;
                transform: translateY(22px) scale(0.96);
                animation-timing-function: cubic-bezier(0.34, 1.4, 0.64, 1);
            }
            52% {
                opacity: 1;
                transform: translateY(0) scale(1);
                animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            }
            88% {
                opacity: 1;
                transform: translateY(0) scale(1);
                animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            }
            99% {
                opacity: 0;
                transform: translateY(14px) scale(0.98);
            }
        }

        @keyframes pulseIA {
            0%, 100% {
                transform: scale(1) rotate(1deg);
                background-color: var(--intelisis-orange-cta);
                animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            }
            52% {
                transform: scale(1) rotate(1deg);
                background-color: var(--intelisis-orange-cta);
                animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            58% {
                transform: scale(1.06) rotate(0deg);
                background-color: var(--intelisis-orange-bright);
                animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            66% {
                transform: scale(1) rotate(1deg);
                background-color: var(--intelisis-orange-cta);
                animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            }
            88% {
                transform: scale(1) rotate(1deg);
                background-color: var(--intelisis-orange-cta);
            }
            99% {
                transform: scale(1) rotate(1deg);
                background-color: var(--intelisis-orange-cta);
            }
        }
    </style>
</head>
<body>

    <div class="banner-container" id="intelisis-banner">
        <div class="top-section">
            <h1 class="title-main">Â¿Tu empresa<br>sigue en Excel?</h1>
            <div class="subtitle-box">
                EstÃ¡s perdiendo control y dinero.
            </div>

            <div class="panicked-worker-container">
                <svg class="panicked-worker-svg" viewBox="0 0 178 120" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <filter id="paper-shadow-worker" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="3" dy="3" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3"/>
                        </filter>
                    </defs>

                    <!-- CabernÃ­cola godinez: atrÃ¡s / lateral izquierdo -->
                    <g filter="url(#paper-shadow-worker)" opacity="0.92"
                       transform="translate(2, 4) translate(50, 118) scale(0.78) translate(-50, -118)">
                        <path d="M 24 118 L 28 108 L 32 114 L 36 106 L 40 115 L 44 108 L 48 116 L 52 109 L 56 117 L 60 110 L 64 118 Z" fill="#b8c4a0"/>
                        <path d="M 26 118 L 30 80 L 38 72 L 50 69 L 62 72 L 70 80 L 74 118 Z" fill="#e8b896"/>
                        <path d="M 38 92 L 50 118 L 62 92 L 50 86 Z" fill="#e6bc3c" stroke="#c9a227" stroke-width="0.5"/>
                        <ellipse cx="44" cy="98" rx="2.2" ry="1.8" fill="#5c4033" transform="rotate(-15 44 98)"/>

    <script>
        (function () {
            const banner = document.getElementById('intelisis-banner');
            const btnToggle = document.getElementById('btn-toggle');
            const btnRestart = document.getElementById('btn-restart');
            const speedBtns = document.querySelectorAll('.speed-btn');
            const isEmbed = document.documentElement.classList.contains('embed-demo');

            function getAnimations() {
                const out = [];
                if (banner && banner.getAnimations) {
                    out.push.apply(out, banner.getAnimations({ subtree: true }));
                }
                if (!isEmbed && document.body.getAnimations) {
                    out.push.apply(out, document.body.getAnimations());
                }
                return out;
            }

            let currentRate = 1;

            function applyPlaybackRate(rate) {
                currentRate = rate;
                getAnimations().forEach(function (a) {
                    a.playbackRate = rate;
                });
            }

            function syncToggleLabel() {
                const anims = getAnimations();
                const running = anims.some(function (a) { return a.playState === 'running'; });
                btnToggle.textContent = running ? 'Pausa' : 'Reproducir';
            }

            btnToggle.addEventListener('click', function () {
                const anims = getAnimations();
                if (!anims.length) return;
                const anyRunning = anims.some(function (a) { return a.playState === 'running'; });
                anims.forEach(function (a) {
                    if (anyRunning) a.pause();
                    else {
                        a.playbackRate = currentRate;
                        a.play();
                    }
                });
                syncToggleLabel();
            });

            btnRestart.addEventListener('click', function () {
                const anims = getAnimations();
                const wasPaused = anims.some(function (a) { return a.playState === 'paused'; });
                anims.forEach(function (a) {
                    a.currentTime = 0;
                    a.playbackRate = currentRate;
                    a.play();
                    if (wasPaused) a.pause();
                });
                syncToggleLabel();
            });

            speedBtns.forEach(function (btn) {
                btn.addEventListener('click', function () {
                    const rate = Number(btn.getAttribute('data-rate')) || 1;
                    speedBtns.forEach(function (b) { b.classList.remove('is-active'); });
                    btn.classList.add('is-active');
                    applyPlaybackRate(rate);
                    getAnimations().forEach(function (a) {
                        if (a.playState === 'paused') a.pause();
                    });
                });
            });

            requestAnimationFrame(function () {
                applyPlaybackRate(1);
                syncToggleLabel();
            });
        })();
    </script>
